server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 上传体积上限（默认 1m，数据导入场景容易超）
    client_max_body_size 10m;

    # ---------- gzip 压缩 ----------
    # 注意：text/html 总会被压缩，无需写进 gzip_types
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/css
                      text/plain
                      application/javascript
                      application/json
                      application/xml
                      image/svg+xml;

    # ---------- 带 hash 的构建产物：永久缓存 ----------
    # Vite 产物名为 assets/xxx-[hash].js，内容变则文件名变，可放心长缓存
    # ^~ 让这个前缀匹配优先于下面的正则规则
    location ^~ /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ---------- 图标 / 字体等静态文件 ----------
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|woff2?|ttf|eot)$ {
        expires    30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------- SPA 路由回退（关键） ----------
    # 应用用的是 history 路由，直接访问 /employee 这种地址时
    # 磁盘上并没有对应文件，必须回退到 index.html 交给前端路由处理
    location / {
        # index.html 本身不能长缓存，否则发版后用户拿到旧壳子
        add_header Cache-Control "no-cache";
        try_files  $uri $uri/ /index.html;
    }

    # ---------- 反向代理（预留示例） ----------
    # 目前是纯前端 + Mock，接真实后端时打开以下配置即可
    # location /api/ {
    #     proxy_pass         http://backend:8080/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }

    # ---------- 基础安全响应头 ----------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;

    # 前端静态资源找不到就 404，不要暴露 nginx 版本
    server_tokens off;
}
